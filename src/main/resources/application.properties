spring.application.name=assistencesystem

# PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/assistencedb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Logging
logging.level.root=WARN
logging.level.com.miguel=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [req=%X{requestId}] [user=%X{employeeId}] %logger{36} - %msg%n

# Error details
server.error.include-stacktrace=always
server.error.include-exception=true
server.error.include-message=always

#Security Configuration
security.session.timeout=30m
security.session.refresh-threshold=10m

#Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=assistencesystem
info.app.description=Production-style backend system for technical assistance management
info.app.version=1.0
